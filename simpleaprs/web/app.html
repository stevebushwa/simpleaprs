<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simpleaprs</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#12324a">
<link rel="stylesheet" href="maplibre-gl.css">
<link rel="stylesheet" href="map.css">
<style>
  :root { --bg: #fff; --fg: #1d1d1f; --dim: #6b6b70; --line: #d8d8dc; --bar: #f3f3f5; --accent: #3367d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1b1e; --fg: #e8e8ea; --dim: #9a9aa0; --line: #38383d; --bar: #26262a; --accent: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { padding: 4px 12px; background: var(--bar); border-bottom: 1px solid var(--line); }
  header .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 30px; }
  header h1 { margin: 0; font-size: 15px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #c33; flex: none; }
  .dot.on { background: #2a9d4a; }
  #status { color: var(--dim); }
  #activity { color: var(--dim); font-size: 13px; }
  #rx { width: 70px; height: 8px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; flex: none; }
  #rx i { display: block; height: 100%; width: 0; background: #2a9d4a; transition: width .1s linear; }
  .grow { flex: 1; }
  main { display: grid; grid-template-columns: 1fr 10px var(--side, 400px); min-height: 0; }
  main.dragging { user-select: none; }
  main.dragging #map { pointer-events: none; }
  #split { position: relative; background: var(--bar); border-left: 1px solid var(--line); cursor: col-resize; touch-action: none; }
  #split:hover, #split:focus-visible, main.dragging #split { background: var(--line); outline: 0; }
  #split::after { content: ""; position: absolute; left: 50%; top: 50%; width: 3px; height: 36px; margin: -18px 0 0 -1.5px; border-radius: 2px; background: var(--dim); }
  #mapbox { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; }
  #msg { bottom: 36px; }  /* clear of the map's scale bar */
  aside { display: flex; flex-direction: column; border-left: 1px solid var(--line); min-height: 0; min-width: 0; overflow: hidden; }
  nav { display: flex; border-bottom: 1px solid var(--line); }
  nav button { flex: 1; border: 0; background: none; color: var(--dim); padding: 9px 4px; font: inherit; cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.on { color: var(--fg); border-bottom-color: var(--accent); }
  .tab { flex: 1; min-height: 0; overflow: auto; }
  .tab[hidden] { display: none; }
  .tab.col { display: flex; flex-direction: column; }
  .tab.col[hidden] { display: none; }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; background: var(--bar); text-align: left; font-weight: 600; color: var(--dim); }
  th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:last-child { word-break: break-word; }
  th[data-sort] { cursor: pointer; user-select: none; white-space: nowrap; }
  th[data-sort]:hover { color: var(--fg); }
  th[data-sort]::after { content: attr(data-arrow); }
  td .coords { color: var(--dim); font-size: 11px; }
  #find { width: 190px; }
  #bell.on { color: var(--accent); border-color: var(--accent); }
  #cards { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 6; width: min(380px, calc(100% - 24px));
           display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .card { pointer-events: auto; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-left: 4px solid var(--accent);
          border-radius: 8px; box-shadow: 0 6px 24px #0006; padding: 10px 12px; }
  .card.bulletin { border-left-color: #e08a00; }
  .card h4 { margin: 0; font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; gap: 8px; }
  .card .body { font-size: 16px; word-break: break-word; margin: 4px 0 8px; white-space: pre-wrap; }
  .card .via { font-size: 12px; color: var(--dim); }
  .card .actions { display: flex; gap: 6px; justify-content: flex-end; }
  #psearch { width: 170px; margin-left: 10px; padding: 3px 8px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--bar); }
  tr.old { color: var(--dim); }
  tr[hidden] { display: none; }
  .log { flex: 1; overflow: auto; padding: 6px 10px 20px; font: 12px ui-monospace, monospace; }
  .log div { padding: 1px 0; word-break: break-all; }
  .log .tx { color: var(--accent); }
  .log .bad { color: var(--dim); font-style: italic; }
  .log .t { color: var(--dim); margin-right: 8px; }
  .bar { padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .bar span { color: var(--dim); margin-left: 8px; }
  #msgs[data-show=direct] .bulletin, #msgs[data-show=bulletin] .direct { display: none; }
  form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
  input, select, button.act { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; }
  button.act { cursor: pointer; background: var(--accent); border-color: var(--accent); color: #fff; }
  button.act:disabled, input:disabled { opacity: .5; cursor: default; }
  #compose { flex-direction: column; }
  #compose .line { display: flex; gap: 6px; }
  #to, #text { flex: 1; min-width: 0; }
  #compose.bulletin { border-top: 2px solid var(--accent); }  /* a bulletin goes to everyone: the form looks different while it is set to one */
  .folder > summary { cursor: pointer; padding: 3px 0; }
  .folder > summary .count, .folder > summary .last { color: var(--dim); margin-left: 8px; }
  .folder.new > summary .who { font-weight: 700; color: var(--accent); }
  .folder > .lines { margin-left: 6px; padding-left: 10px; border-left: 2px solid var(--line); }
  button.ghost { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; cursor: pointer; }
  button.ghost.danger { color: #c33; }
  #settings { padding: 10px 12px; }
  .sub { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
  .sub button { border: 1px solid var(--line); background: none; color: var(--dim); border-radius: 14px; padding: 3px 11px; font: inherit; cursor: pointer; }
  .sub button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .fld { margin: 0 0 13px; }
  .fld > label.t { display: block; margin-bottom: 3px; font-weight: 600; }
  .fld input[type=text], .fld input[type=number], .fld input[type=password], .fld select { width: 100%; }
  .fld .check { display: flex; gap: 7px; align-items: flex-start; font-weight: 600; }
  .fld .check input { margin-top: 3px; }
  .fld .row { display: flex; gap: 6px; align-items: center; }
  .fld .unit { color: var(--dim); white-space: nowrap; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .err { color: #c33; font-size: 12px; margin-top: 3px; }
  .savebar button { white-space: nowrap; }
  .savebar { display: flex; gap: 10px; align-items: center; margin-top: 4px; position: sticky; bottom: 0; background: var(--bg); padding: 8px 0; }
  .notice { background: var(--bar); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; }
  h3 { margin: 18px 0 8px; font-size: 14px; }
  #igate { color: var(--dim); }
  #freqcard { position: fixed; z-index: 30; width: min(460px, calc(100vw - 24px)); max-height: min(72vh, 600px); overflow: auto; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgba(0, 0, 0, .3); }
  #freqcard[hidden] { display: none; }
  #freqfind { position: sticky; top: 0; z-index: 1; width: 100%; box-sizing: border-box; border-radius: 8px 8px 0 0; padding: 8px 10px; }
  #freqcard h4 { margin: 0; padding: 7px 10px 3px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); background: var(--bar); border-top: 1px solid var(--line); }
  #freqcard .gnote { padding: 4px 10px 0; font-size: 12px; color: var(--dim); }
  .frow { display: grid; grid-template-columns: minmax(96px, 38%) 1fr; gap: 4px 10px; padding: 5px 10px; border-top: 1px solid var(--line); }
  .frow[hidden] { display: none; }
  .frow .ff { font: 600 13px ui-monospace, monospace; word-break: break-word; }
  .frow .fm { color: var(--dim); font-size: 12px; }
  #freqsrc, #freqnone { padding: 8px 10px 10px; font-size: 11px; color: var(--dim); border-top: 1px solid var(--line); }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 18px var(--side, 36vh); }
    #split { border-left: 0; border-top: 1px solid var(--line); cursor: row-resize; }
    #split::after { width: 40px; height: 4px; margin: -2px 0 0 -20px; }
    aside { border-left: 0; }
  }
</style>
<header>
  <div class="row">
    <span class="dot" id="conn"></span><h1 id="title">simpleaprs</h1>
    <span class="popwrap"><button class="ghost" id="freqbtn" aria-expanded="false" aria-controls="freqcard" title="Quick reference: APRS, the ISS, simplex calling, weak signal, HF digital">Frequencies</button></span>
    <span class="grow"></span>
    <input id="find" type="search" list="finds" placeholder="Find a station" title="A callsign, or a word from its comment: Enter shows it on the map with its route" autocomplete="off">
    <datalist id="finds"></datalist>
    <label>Show <select id="filter">
      <option value="all">All stations</option><option value="weather">Weather stations</option><option value="igate">iGates</option>
      <option value="digi">Digipeaters</option><option value="mobile">Mobile (vehicles, aircraft, boats)</option></select></label>
    <button class="ghost" id="bell" title="Sound, vibration and a browser notification when a message or bulletin arrives">Alerts off</button>
    <button class="act" id="beacon" disabled>Beacon now</button>
    <button class="ghost" id="logout" hidden>Log out</button>
  </div>
  <div class="row">
    <span id="status">Connecting...</span>
    <span id="activity"></span>
    <span class="grow"></span>
    <span id="igate"></span>
    <span id="rx" title="RX audio level"><i></i></span>
  </div>
</header>
<div id="freqcard" role="dialog" aria-label="Frequencies" hidden>
  <input id="freqfind" type="search" placeholder="Search: ISS, 2 m, FT8, 146.520" autocomplete="off" aria-label="Search frequencies">
  <div id="freqlist"></div>
  <div id="freqsrc"></div>
</div>
<main>
  <div id="mapbox"><div id="map"></div><div id="msg"></div><div id="cards"></div></div>
  <div id="split" role="separator" tabindex="0" title="Drag to resize, tap to hide or show"></div>
  <aside>
    <nav><button data-tab="stations" class="on">Stations</button><button data-tab="messages">Messages</button><button data-tab="packets">Raw packets</button><button data-tab="settings">Settings</button></nav>
    <div class="tab" id="stations"><table><thead><tr><th data-sort="call" title="Sort by callsign">Station</th><th data-sort="heard" title="Sort by when last heard">Heard</th><th data-sort="dist" title="Sort by distance from you">Distance</th><th>Comment</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="tab col" id="messages" hidden>
      <div class="bar"><label>Show <select id="mfilter"><option value="all">All messages</option><option value="direct">Direct messages</option><option value="bulletin">Bulletins</option></select></label></div>
      <div class="log" id="msgs"></div>
      <form id="compose">
        <div class="line"><select id="mode" title="What to send"><option value="message">Message</option><option value="bulletin">Bulletin</option></select>
          <input id="to" placeholder="To callsign" autocapitalize="characters">
          <select id="bn" title="Bulletin number" hidden><option>BLN0</option><option selected>BLN1</option><option>BLN2</option><option>BLN3</option><option>BLN4</option>
            <option>BLN5</option><option>BLN6</option><option>BLN7</option><option>BLN8</option><option>BLN9</option><option value="BLNX">BLNX (urgent)</option></select></div>
        <div class="line"><input id="text" placeholder="Message (max 67 chars)" maxlength="67"><button class="act" disabled>Send message</button></div>
      </form>
    </div>
    <div class="tab col" id="packets" hidden>
      <div class="bar"><label>Show <select id="pfilter"><option value="3600">Last hour</option>
        <option value="21600">Last 6 hours</option><option value="43200">Last 12 hours</option>
        <option value="86400">Last day</option><option value="604800">Last week</option><option value="0">All (a month)</option></select></label>
        <input id="psearch" type="search" placeholder="Search packets" autocomplete="off"><span id="pstatus"></span></div>
      <div class="log" id="pkts"></div>
    </div>
    <div class="tab" id="settings" hidden></div>
  </aside>
</main>
<script src="maplibre-gl.js"></script>
<script src="pmtiles.js"></script>
<script src="glyphs.js"></script>
<script src="frequencies.js"></script>
<script src="map.js"></script>
<script>
  const $ = id => document.getElementById(id);
  if (typeof window.setStation !== "function") $("msg").textContent = "The map needs WebGL, which this browser isn't providing - stations are still listed";
  // Everything below comes off the air or from the server: only ever put it on the page with textContent.
  const stamp = t => { const d = new Date(t * 1000);
    return d.toDateString() === new Date().toDateString() ? d.toLocaleTimeString([], {hour12: false}) : d.toLocaleString([], {hour12: false, dateStyle: "short", timeStyle: "short"}); };
  const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

  // The sidebar (below the map on a phone) can be dragged to any size, or tapped shut to give the map the whole screen.
  const main = document.querySelector("main"), split = $("split"), narrow = matchMedia("(max-width: 800px)");
  const sizeKey = () => narrow.matches ? "side_h" : "side_w";
  const room = () => (narrow.matches ? main.clientHeight : main.clientWidth) - split.offsetHeight * narrow.matches - split.offsetWidth * !narrow.matches;
  const setSide = (px, save) => {
    px = Math.max(0, Math.min(Math.round(px), room() - 80));
    main.style.setProperty("--side", px + "px");
    if (save) store.set(sizeKey(), px);
    if (typeof map !== "undefined") map.resize();
    return px;
  };
  const applySide = () => {
    const v = store.get(sizeKey());
    if (v === null) main.style.removeProperty("--side"); else setSide(+v, false);
    if (typeof map !== "undefined") map.resize();
  };
  const sideSize = () => narrow.matches ? document.querySelector("aside").offsetHeight : document.querySelector("aside").offsetWidth;
  const toggleSide = () => {
    if (sideSize() > 0) { store.set("side_prev" + sizeKey(), sideSize()); setSide(0, true); }
    else setSide(+store.get("side_prev" + sizeKey()) || (narrow.matches ? room() * .4 : 400), true);
  };
  split.onpointerdown = e => {
    e.preventDefault();
    split.setPointerCapture(e.pointerId);
    const start = narrow.matches ? e.clientY : e.clientX, from = sideSize();
    let moved = false;
    main.classList.add("dragging");
    split.onpointermove = m => {
      const d = (narrow.matches ? m.clientY : m.clientX) - start;
      if (Math.abs(d) > 4) moved = true;
      if (moved) setSide(from - d, false);
    };
    split.onpointerup = split.onpointercancel = () => {
      split.onpointermove = split.onpointerup = split.onpointercancel = null;
      main.classList.remove("dragging");
      if (moved) store.set(sizeKey(), sideSize()); else toggleSide();
    };
  };
  split.onkeydown = e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleSide(); }
  };
  narrow.addEventListener("change", applySide);
  addEventListener("resize", () => { if (store.get(sizeKey()) !== null) applySide(); });
  applySide();

  // tabs
  for (const b of document.querySelectorAll("nav button")) b.onclick = () => {
    if (sideSize() === 0) toggleSide();  // picking a tab while the sidebar is shut opens it
    for (const o of document.querySelectorAll("nav button")) o.classList.toggle("on", o === b);
    for (const t of document.querySelectorAll(".tab")) t.hidden = t.id !== b.dataset.tab;
    store.set("tab", b.dataset.tab);
    for (const l of document.querySelectorAll(".log")) l.scrollTop = l.scrollHeight;
    if (b.dataset.tab === "settings") loadSettings();
  };
  const toLogin = () => { location.href = "/login"; };

  // stations
  const stations = {};  // call -> {ev, tr}
  let filter = store.get("filter") || "all";
  $("filter").value = filter;
  const visible = ev => filter === "all" || ev.kinds.includes(filter);
  // The map is the one part that needs WebGL; if it can't start, the lists still work.
  const onMap = (name, ...args) => { if (typeof window[name] === "function") window[name](...args); };
  const plot = call => {
    const {ev, tr} = stations[call];
    tr.hidden = !visible(ev);
    tr.classList.toggle("old", ev.stale || !!ev.unverified);
    tr.children[1].textContent = stamp(ev.heard);
    tr.children[3].textContent = ev.note;
    const label = filter === "weather" && ev.temp ? `${call} ${ev.temp}` : call;
    const info = [["Heard", stamp(ev.heard) + (ev.unverified ? " (unverified)" : ev.stale ? " (previous session)" : "")], ...ev.info];
    onMap("setStation", call, ev.lat, ev.lon, label, false, info, ev.stale || !!ev.unverified, ev.icon, ev.cls, ev.segs, visible(ev), ev.trail);
  };
  const forget = calls => {
    for (const c of calls) { stations[c]?.tr.remove(); stations[c]?.opt.remove(); delete stations[c]; }
    onMap("removeStations", calls);
    showDirectSoon();
  };
  $("filter").onchange = e => { filter = e.target.value; store.set("filter", filter); Object.keys(stations).forEach(plot); };
  // distance from your own station, in miles (null until it has a position)
  const miles = (lat, lon) => {
    if (!me || !(me.lat || me.lon)) return null;
    const r = x => x * Math.PI / 180, a = Math.sin(r(lat - me.lat) / 2) ** 2 + Math.cos(r(me.lat)) * Math.cos(r(lat)) * Math.sin(r(lon - me.lon) / 2) ** 2;
    return 3958.8 * 2 * Math.asin(Math.sqrt(a));
  };
  const setPlace = s => {
    s.dist = miles(s.ev.lat, s.ev.lon);
    s.tr.children[2].firstChild.textContent = s.dist === null ? "" : s.dist < 10 ? s.dist.toFixed(1) + " mi" : Math.round(s.dist) + " mi";
    s.tr.children[2].lastChild.textContent = `${s.ev.lat.toFixed(4)}, ${s.ev.lon.toFixed(4)}`;
  };
  // The list's order: click a heading to sort by it, again to turn it round. Sorting waits while the pointer is over the list
  // (rows would move under it) and happens in one go, since a backlog arrives as thousands of events.
  const SORTS = ["call", "heard", "dist"];
  let sortBy = SORTS.includes(store.get("sortBy")) ? store.get("sortBy") : "heard", sortDir = store.get("sortDir") === "-1" ? -1 : 1;  // 1: A to Z, newest, nearest
  const compare = {call: (a, b) => a.ev.call.localeCompare(b.ev.call, undefined, {numeric: true}), heard: (a, b) => b.ev.heard - a.ev.heard, dist: (a, b) => a.dist - b.dist};
  let sortTimer = 0, sortLate = false;
  const sortRows = () => {
    sortLate = false;
    const all = Object.values(stations), known = all.filter(s => sortBy !== "dist" || s.dist !== null);
    known.sort((a, b) => sortDir * compare[sortBy](a, b));
    $("rows").append(...known.map(s => s.tr), ...all.filter(s => !known.includes(s)).map(s => s.tr));  // no distance: last, whichever way
    for (const th of document.querySelectorAll("th[data-sort]"))
      th.dataset.arrow = th.dataset.sort === sortBy ? (sortDir === 1 ? " \u25B2" : " \u25BC") : "";
  };
  const sortSoon = () => {
    clearTimeout(sortTimer);
    sortTimer = setTimeout(() => { if ($("rows").matches(":hover")) sortLate = true; else sortRows(); }, 800);
  };
  $("rows").onmouseleave = () => { if (sortLate) sortRows(); };
  for (const th of document.querySelectorAll("th[data-sort]")) th.onclick = () => {
    sortDir = th.dataset.sort === sortBy ? -sortDir : 1; sortBy = th.dataset.sort;
    store.set("sortBy", sortBy); store.set("sortDir", String(sortDir)); sortRows();
  };
  const onStation = ev => {
    let s = stations[ev.call];
    if (!s) {
      const tr = document.createElement("tr");
      for (let i = 0; i < 4; i++) tr.appendChild(document.createElement("td"));
      tr.children[0].textContent = ev.call;
      tr.children[2].append(document.createElement("div"), mk("div", {className: "coords"}));
      tr.onclick = () => onMap("showStation", ev.call, 12);  // as if its icon had been clicked: popup and route
      $("rows").appendChild(tr);
      s = stations[ev.call] = {tr, opt: mk("option", {value: ev.call})};
      $("finds").appendChild(s.opt);
    }
    const was = s.ev;
    s.ev = ev;
    s.opt.label = ev.note.slice(0, 60);
    setPlace(s);
    plot(ev.call);
    sortSoon();
    if (!was || was.direct !== ev.direct || was.lat !== ev.lat || was.lon !== ev.lon) showDirectSoon();
  };

  // Your own icon: who you hear straight from, with no digipeater between (a station's last packet decides)
  let directTimer = 0;
  const showDirectSoon = () => { clearTimeout(directTimer); directTimer = setTimeout(showDirect, 400); };
  const showDirect = () => {
    if (!me || !(me.lat || me.lon)) return;
    const near = Object.values(stations).filter(s => s.ev.direct).sort((a, b) => a.dist - b.dist);
    const names = near.slice(0, 12).map(s => s.ev.call).join(", ") + (near.length > 12 ? ` and ${near.length - 12} more` : "");
    onMap("setStation", me.call, me.lat, me.lon, me.call, true, [...me.info, ["Heard directly", near.length ? `${near.length}: ${names}` : "no one yet"]], false, me.icon, "me");
    onMap("setDirect", [me.lon, me.lat], near.map(s => [s.ev.lon, s.ev.lat]));
  };

  // Find a station by callsign (or a word from its comment) and show it on the map
  $("find").onchange = e => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) return;
    const all = Object.values(stations), call = s => s.ev.call.toLowerCase();
    const hit = all.find(s => call(s) === q) || all.find(s => call(s).startsWith(q)) || all.find(s => call(s).includes(q)) || all.find(s => s.ev.note.toLowerCase().includes(q));

  let searchTimer = 0;
  $("psearch").oninput = e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { query = e.target.value.trim().toLowerCase(); showSpan(); $("pkts").scrollTop = $("pkts").scrollHeight; }, 150);
  };
  $("pfilter").onchange = e => { store.set("pfilter", e.target.value); showSpan(); reach().then(() => { $("pkts").scrollTop = $("pkts").scrollHeight; }); };
  $("pfilter").value = PKT_SHOWS.includes(store.get("pfilter")) ? store.get("pfilter") : "86400";
  setInterval(showSpan, 60000);  // on quiet air a packet can pass out of the window on its own

  // talking to the server
  let allowTx = false, centered = false, me = null;
  // one form for both kinds, so a bulletin can't be sent by landing on the wrong button: it says which it is, and stays shut until there is something to send
  const syncCompose = () => {
    const bulletin = $("mode").value === "bulletin", btn = $("compose").querySelector("button");
    $("to").hidden = bulletin; $("bn").hidden = !bulletin;
    $("text").placeholder = (bulletin ? "Bulletin" : "Message") + " (max 67 chars)";
    btn.textContent = bulletin ? "Send bulletin" : "Send message";
    btn.disabled = !allowTx || !$("text").value.trim() || (!bulletin && !$("to").value.trim());
    $("compose").classList.toggle("bulletin", bulletin);
  };
  const setBusy = () => { $("beacon").disabled = !allowTx; syncCompose(); };
  for (const id of ["mode", "to", "text"]) $(id).oninput = syncCompose;
  const say = (text, ms = 6000) => { $("status").textContent = text; clearTimeout(say.t); if (ms) say.t = setTimeout(idle, ms); };
  let radio = {ok: true, text: "", note: ""}, igateText = "", welcomed = false;
  const idle = () => {
    $("status").textContent = !me ? "Connecting..." : !radio.ok ? `No radio: ${radio.text} (see Settings)` : (allowTx ? "Listening" : "Listening (view only)") + (radio.note ? ` - ${radio.note}` : "");
    $("igate").textContent = igateText;
  };
  const post = async body => {
    try {
      const r = await fetch("/api/tx", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
      if (r.status === 401) return toLogin();
      const j = await r.json().catch(() => ({}));
      say(r.ok ? "Sent" : `Server refused: ${j.error || r.status}`);
      return r.ok;
    } catch { say("Could not reach the server"); return false; }
  };
  $("beacon").onclick = () => post({type: "beacon"});
  $("compose").onsubmit = async e => {
    e.preventDefault();
    if ($("compose").querySelector("button").disabled) return;
    const text = $("text").value.trim();
    if ($("mode").value === "bulletin") {
      const to = $("bn").value;
      if (!confirm(`Send this bulletin to everyone who can hear you?\n\n${to}: ${text}`)) return;
      if (await post({type: "bulletin", to, text})) { $("text").value = ""; $("mode").value = "message"; }  // and back to messages
    } else if (await post({type: "message", to: $("to").value.trim().toUpperCase(), text})) $("text").value = "";
    syncCompose();
  };
  // The map's "Message" popup button: open the message form addressed to that station.
  window.onStationAction = (what, call) => {
    if (what === "clear-inactive") {
      const n = Object.values(stations).filter(s => s.ev.stale).length;
      if (!n) return say("Every station was heard since the server started");
      if (!confirm(`Forget ${n} station${n === 1 ? "" : "s"} not heard since the server started?\n\nThey are removed from the map, the list and the server's saved file.`)) return;
      api("/api/forget-inactive", {}).then(r => say(r.ok ? `Forgot ${r.body.removed} stations` : `Could not clear them: ${r.body.error || r.status}`)).catch(() => {});
      return;
    }
    if (what !== "message") return;
    document.querySelector("nav button[data-tab=messages]").click();
    $("mode").value = "message"; $("to").value = call; syncCompose(); $("text").focus();
  };

  let synced = false;
  const logActivity = text => { $("activity").textContent = new Date().toLocaleTimeString([], {hour12: false}) + "  " + text; };
  const handle = ev => {
    if (ev.sync) { synced = true; covered = ev.since || 0; reach(); return idle(); }
    switch (ev.type) {
      case "me":
        me = ev; allowTx = ev.allow_tx;
        $("title").textContent = ev.call || "simpleaprs";
        document.title = `${ev.call || "simpleaprs"} - simpleaprs`;
        setBusy(); idle();
        if (ev.lat || ev.lon) {
          onMap("setStation", ev.call, ev.lat, ev.lon, ev.call, true, ev.info, false, ev.icon, "me");
          Object.values(stations).forEach(setPlace); sortSoon(); showDirectSoon();  // distances are from here
          if (!centered) { centered = true; onMap("centerOn", ev.lat, ev.lon, 9); }
        }
        break;
      case "status":
        radio = {ok: ev.radio_ok, text: ev.radio, note: ev.rx_note || ""}; igateText = ev.igate || ""; idle();
        if (!ev.configured && !welcomed) { welcomed = true; document.querySelector("nav button[data-tab=settings]").click(); }
        if (schema) { schema.status = ev; if (!$("settings").hidden && ["Radio", "iGate"].includes(group)) renderSettings(); }
        break;
      case "level":
        document.querySelector("#rx i").style.width = Math.round(Math.min(1, ev.level) * 100) + "%";
        clearTimeout(handle.rx); handle.rx = setTimeout(() => document.querySelector("#rx i").style.width = "0", 1500);
        break;
      case "station": onStation(ev); if (synced) logActivity(`Heard ${ev.call}`); break;
      case "gone": forget(ev.calls); break;
      case "packet": addLine($("pkts"), ev.t, ev.text, ev.tx ? "tx" : ev.bad ? "bad" : "", Infinity); showSpan(false); if (synced && ev.tx) logActivity("Transmitted a packet"); break;
      case "message": addMessage(ev); alertFor(ev); if (synced) logActivity(ev.text.length > 70 ? ev.text.slice(0, 70) + "..." : ev.text); break;
    }
  };
  // Frequencies: a card that drops down under its button, filtered by what is typed. The list is plain data in frequencies.js.
  const freqCard = $("freqcard"), freqBtn = $("freqbtn"), freqFind = $("freqfind");
  if (typeof FREQUENCIES === "undefined") freqBtn.hidden = true;
  else {
    const rows = [];  // {el, text, head}
    const list = $("freqlist");
    for (const g of FREQUENCIES.groups) {
      const head = mk("div", {}, mk("h4", {textContent: g.name}), ...(g.note ? [mk("div", {className: "gnote", textContent: g.note})] : []));
      list.append(head);
      const mine = [];
      for (const it of g.items) {
        const el = mk("div", {className: "frow"}, mk("div", {className: "ff", textContent: it.f}),
          mk("div", {}, mk("div", {textContent: it.what}), ...(it.mode ? [mk("div", {className: "fm", textContent: it.mode})] : [])));
        list.append(el);
        mine.push({el, text: `${g.name} ${it.f} ${it.mode} ${it.what}`.toLowerCase()});
      }
      rows.push({head, group: g.name.toLowerCase(), items: mine});
    }
    list.append(mk("div", {id: "freqnone", hidden: true, textContent: "Nothing matches."}));
    $("freqsrc").textContent = `Checked ${FREQUENCIES.checked}. ${FREQUENCIES.sources}`;
    const filter = () => {
      const words = freqFind.value.toLowerCase().split(/\s+/).filter(Boolean);
      let any = false;
      for (const r of rows) {
        let shown = 0;
        for (const it of r.items) { const ok = words.every(w => it.text.includes(w)); it.el.hidden = !ok; shown += ok; }
        r.head.hidden = !shown;
        any = any || shown > 0;
      }
      $("freqnone").hidden = any;
    };
    const place = () => {  // under the button, kept on the screen
      const b = freqBtn.getBoundingClientRect(), w = freqCard.offsetWidth;
      freqCard.style.top = Math.round(b.bottom + 6) + "px";
      freqCard.style.left = Math.round(Math.max(12, Math.min(b.left, innerWidth - w - 12))) + "px";
    };
    const setOpen = open => {
      freqCard.hidden = !open;
      freqBtn.setAttribute("aria-expanded", String(open));
      if (open) { place(); if (matchMedia("(hover: hover)").matches) freqFind.focus(); }  // on a phone the keyboard would cover the list
    };
    freqBtn.onclick = e => { e.stopPropagation(); setOpen(freqCard.hidden); };
    freqFind.oninput = filter;
    freqCard.onclick = e => e.stopPropagation();
    document.addEventListener("click", () => { if (!freqCard.hidden) setOpen(false); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !freqCard.hidden) { setOpen(false); freqBtn.focus(); } });
    addEventListener("resize", () => { if (!freqCard.hidden) place(); });
  }

  const savedTab = store.get("tab"); if (savedTab) document.querySelector(`nav button[data-tab=${savedTab}]`)?.click();
  const es = new EventSource("/web/events");
  es.onopen = () => { synced = false; epoch++; loading = false; covered = 0; $("pstatus").textContent = ""; $("conn").classList.add("on"); $("msgs").textContent = ""; folders.clear(); $("pkts").textContent = ""; };  // the server replays them
  es.onerror = () => {
    $("conn").classList.remove("on"); document.querySelector("#rx i").style.width = "0"; say("Connection lost, retrying...", 0);
    fetch("/api/auth/state").then(r => r.ok ? r.json() : null).then(s => { if (s && !s.logged_in) toLogin(); }).catch(() => {});  // logged out elsewhere?
  };
  es.onmessage = e => handle(JSON.parse(e.data));
</script>
</html>
