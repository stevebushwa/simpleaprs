name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: pip install -e '.[all,dev]'
      - run: python -m pytest -q
        env: {QT_QPA_PLATFORM: offscreen}

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
      - run: APPIMAGETOOL="$RUNNER_TEMP/appimagetool" bash scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with: {name: simpleaprs-linux-x86_64, path: dist/simpleaprs-x86_64.AppImage}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ".[gui]" pyinstaller pillow
      - run: python packaging/make_icons.py build/icons
      - run: pyinstaller --noconfirm packaging/simpleaprs.spec
        env: {SIMPLEAPRS_ICONS: build/icons}
      - name: Check the packaged app starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/simpleaprs/simpleaprs.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest exited with $($p.ExitCode)" }
      - run: Compress-Archive -Path dist/simpleaprs -DestinationPath simpleaprs-windows-x64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: {name: simpleaprs-windows-x64, path: simpleaprs-windows-x64.zip}

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, arch: arm64}
          - {os: macos-15-intel, arch: x86_64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ".[gui]" pyinstaller pillow
      - run: python packaging/make_icons.py build/icons
      - run: pyinstaller --noconfirm packaging/simpleaprs.spec
        env: {SIMPLEAPRS_ICONS: build/icons}
      - name: Check the packaged app starts
        run: dist/simpleaprs.app/Contents/MacOS/simpleaprs --selftest
        env: {QT_QPA_PLATFORM: offscreen}
      - run: ditto -c -k --keepParent dist/simpleaprs.app simpleaprs-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with: {name: "simpleaprs-macos-${{ matrix.arch }}", path: "simpleaprs-macos-${{ matrix.arch }}.zip"}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: assets, merge-multiple: true}
      - run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env: {GH_TOKEN: "${{ github.token }}"}
